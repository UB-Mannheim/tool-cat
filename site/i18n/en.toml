# Tooltips on the details of each card (the rows below the dotted line)
tip_oer = "Whether the tool is suitable for creating Open Educational Resources."
tip_costs = "Free: no fees. Freemium: free basic version with paid extensions. Paid version: subscription or license required."
tip_account = "Indicates whether registration with the service provider is required to use the tool."
tip_opensource = "Whether the source code is published under an open-source license, so that it can be viewed, reused, and adapted."
tip_location_group = "Where the provider operates the service and processes user data. With \"Local PC\", data is not passed on to cloud providers."
tip_skill = "How much technical knowledge (e.g., Python skills) is required to use the tool."

