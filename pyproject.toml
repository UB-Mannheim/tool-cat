[project]
name = "tool-cat"
version = "0.1.0"
description = "Bilingual (English/German) generative AI tools for teaching and creating Open Educational Resources, delivered as a simple Hugo website."
readme = "README.md"
authors = [
    { name = "Thomas Schmidt", email = "thomas.schmidt@uni-mannheim.de" }
]
requires-python = ">=3.13"
dependencies = [
    "hugo>=0.169.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
tcat = "toolcat:main"

[tool.setuptools.packages.find]
include = ["toolcat*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
